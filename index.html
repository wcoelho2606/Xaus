<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar Quant XAUS v4 - Painel Externo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-5xl mx-auto">
    <!-- Cabeçalho -->
    <div class="flex flex-wrap justify-between items-center border-b border-slate-800 pb-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-amber-400">RADAR QUANTITATIVO XAUS v4</h1>
        <p class="text-sm text-slate-400">Monitoramento Externo em Tempo Real • Gatilho Score ≥ 75</p>
      </div>
      <div class="text-right">
        <span id="api-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-300">
          CONECTANDO...
        </span>
        <p id="last-update" class="text-xs text-slate-500 mt-1">--:--:--</p>
      </div>
    </div>

    <!-- Métricas Macro -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <span class="text-xs text-slate-400 uppercase">PAXG / Gold Ratio</span>
        <p id="paxg-val" class="text-xl font-mono font-bold mt-1">--</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <span class="text-xs text-slate-400 uppercase">Razão Ouro / Prata</span>
        <p id="auag-val" class="text-xl font-mono font-bold mt-1">--</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 col-span-2 md:col-span-1">
        <span class="text-xs text-slate-400 uppercase">Alerta Sonoro Web</span>
        <button id="btn-som" onclick="toggleSom()" class="mt-1 w-full py-1.5 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold">
          ATIVAR SOM DE GATILHO
        </button>
      </div>
    </div>

    <!-- Cards dos Ativos -->
    <div id="cards-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://SEU_PROJETO.supabase.co";
    const SUPABASE_KEY = "SUA_SUPABASE_ANON_KEY";
    let somAtivo = false;

    function toggleSom() {
      somAtivo = !somAtivo;
      const btn = document.getElementById("btn-som");
      btn.textContent = somAtivo ? "SOM ATIVADO (ON)" : "ATIVAR SOM DE GATILHO";
      btn.className = somAtivo
        ? "mt-1 w-full py-1.5 px-3 rounded-lg bg-emerald-600 text-white text-xs font-semibold"
        : "mt-1 w-full py-1.5 px-3 rounded-lg bg-slate-800 text-xs font-semibold";
    }

    function tocarBipe() {
      if (!somAtivo) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }

    async function atualizarPainel() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/radar_xaus?id=eq.1`, {
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        const rows = await res.json();
        if (!rows.length) return;
        const d = rows[0];

        const badge = document.getElementById("api-badge");
        badge.textContent = `API: ${d.api_status}`;
        badge.className = d.api_status === "FRESH"
          ? "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40"
          : "px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-400";

        document.getElementById("last-update").textContent = `Atualizado: ${d.updated_at}`;
        document.getElementById("paxg-val").textContent = Number(d.paxg_ratio).toFixed(4);
        document.getElementById("auag-val").textContent = Number(d.au_ag_ratio).toFixed(2);

        const ativos = [
          { nome: "XAUUSD (Ouro)", z: d.xau_z, score: d.xau_score, sinal: d.xau_sinal },
          { nome: "BTCUSD (Bitcoin)", z: d.btc_z, score: d.btc_score, sinal: d.btc_sinal },
          { nome: "XAGUSD (Prata)", z: d.xag_z, score: d.xag_score, sinal: d.xag_sinal }
        ];

        let gatilhoAtivo = false;
        document.getElementById("cards-container").innerHTML = ativos.map(a => {
          const pronto = a.score >= 75 && a.sinal !== "NEUTRO";
          if (pronto) gatilhoAtivo = true;
          const corBorda = pronto
            ? (a.sinal === "COMPRA" ? "border-emerald-500 bg-emerald-950/20" : "border-rose-500 bg-rose-950/20")
            : "border-slate-800 bg-slate-900";
          const corSinal = a.sinal === "COMPRA" ? "text-emerald-400" : (a.sinal === "VENDA" ? "text-rose-400" : "text-slate-400");

          return `
            <div class="border ${corBorda} rounded-2xl p-5 transition-all">
              <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-lg">${a.nome}</h2>
                <span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-800">Z-M5: ${Number(a.z).toFixed(2)}</span>
              </div>
              <div class="my-4">
                <div class="flex justify-between text-xs mb-1">
                  <span class="text-slate-400">Score de Confluência</span>
                  <span class="font-bold">${Number(a.score).toFixed(1)} / 100</span>
                </div>
                <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
                  <div class="bg-amber-400 h-2.5" style="width: ${Math.min(100, a.score)}%"></div>
                </div>
              </div>
              <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center">
                <span class="text-xs text-slate-400">Status</span>
                <span class="font-bold text-sm ${corSinal}">${pronto ? `>>> ${a.sinal} <<<` : a.sinal}</span>
              </div>
            </div>
          `;
        }).join("");

        if (gatilhoAtivo) tocarBipe();
      } catch (e) {
        console.error("Erro ao ler Supabase:", e);
      }
    }

    atualizarPainel();
    setInterval(atualizarPainel, 5000);
  </script>
</body>
</html>
